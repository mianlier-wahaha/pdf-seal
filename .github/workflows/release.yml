# 推送 v* 标签时自动：构建 → 打包 app/zip/dmg → 创建 GitHub Release 并挂载安装包
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14   # Apple Silicon macOS 构建机
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & package
        run: ./scripts/make_app.sh

      - name: Verify bundle version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PLIST="release/PDF骑缝章.app/Contents/Info.plist"
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          echo "tag=$TAG bundle=$VER"
          [ "$TAG" = "$VER" ] || { echo "版本不一致：tag v$TAG vs bundle $VER"; exit 1; }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # GitHub 会剥掉附件名中的非 ASCII 字符，故用 ASCII 安全名上传
          mkdir -p release/upload
          cp "release/PDF骑缝章.zip" "release/upload/PDF-Seal.zip"
          cp "release/PDF骑缝章.dmg" "release/upload/PDF-Seal.dmg"
          gh release delete "$TAG" --yes --cleanup-tag false || true
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            "release/upload/PDF-Seal.zip" "release/upload/PDF-Seal.dmg"
